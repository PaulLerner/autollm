[project]
name = "autollm"
version = "0.1.0"
description = "Easy data distillation of LLMs for text classification, information extraction, and open-ended tasks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "jsonargparse>=4.51.0",
    "jupyterlab>=4.6.3",
    "openai>=3.5.0",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
]
authors = [
  {name = "Paul Lerner"}
]
license = "MIT"
license-files = ["LICENSE"]
[project.urls]
Homepage = "https://github.com/PaulLerner/autollm"
[tool.uv]
package = true